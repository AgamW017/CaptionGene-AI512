services:
  wastecap:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    image: wastecap:latest
    ports:
      - "${WASTECAP_PORT:-8501}:8501"
    env_file:
      - path: .env
        required: false
    environment:
      WASTECAP_DB_PATH: /workspace/data/db/wastecap.db
      WASTECAP_CONFIGS_DIR: /workspace/configs
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - wastecap-data:/workspace/data
      - wastecap-results:/workspace/results
      - wastecap-cache:/home/wastecap/.cache
    restart: unless-stopped

volumes:
  wastecap-data:
  wastecap-results:
  wastecap-cache:
